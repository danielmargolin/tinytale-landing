<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>טוען…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet" />
  <style>
    :root {
      --purple: #504df2;
      --purple-shadow: #3330d3;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-400: #9ca3af;
      --gray-500: #6b7280;
      --gray-600: #4b5563;
      --gray-900: #111827;
      --page-bg: #f3f5fa;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      font-family: "Noto Sans Hebrew", sans-serif;
      background: var(--page-bg);
      color: var(--gray-900);
    }

    .root {
      position: relative;
      width: 100%;
      height: 100%;
      background: var(--page-bg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Fixed top-right (physical right, including Hebrew) */
    .back-btn-wrap {
      position: fixed;
      top: max(var(--safe-top), 20px);
      right: 28px;
      width: auto;
      height: 44px;
      z-index: 1000;
    }

    .back-btn {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: auto;
      height: 100%;
      padding: 2px 18px;
      box-sizing: content-box;
      border: 1px solid #e9edf6;
      border-radius: 100px;
      background: #fff;
      box-shadow: none;
      color: #02ba81;
      cursor: pointer;
      font-family: inherit;
    }

    .back-btn i {
      font-size: 18px;
      line-height: 1;
    }

    .back-btn-label {
      font-size: 16px;
      font-weight: 600;
      color: #111827;
      line-height: 1;
    }

    .status {
      flex: 1;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 48px 28px;
      text-align: center;
    }

    .status.is-visible {
      display: flex;
    }

    .status-message {
      font-size: 18px;
      font-weight: 500;
      color: var(--gray-600);
    }

    .status-link {
      color: var(--purple);
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
    }

    .page-container {
      display: none;
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: 1360px;
      align-self: center;
      flex-direction: row;
      gap: 28px;
      padding: max(var(--safe-top), 24px) var(--page-pad-x, 28px) max(var(--safe-bottom), 24px);
    }

    .page-container.is-visible {
      display: flex;
    }

    .cover-column {
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      width: var(--cover-width, 360px);
    }

    .cover-card {
      width: 100%;
      aspect-ratio: 0.72;
      max-height: 100%;
      align-self: center;
      border-radius: 30px;
      background: #d7dce6;
      overflow: hidden;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.12);
    }

    .cover-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content-column {
      flex: 1;
      min-width: 0;
      min-height: 0;
      display: flex;
    }

    .content-card {
      flex: 1;
      min-height: 0;
      background: #fff;
      border-radius: 30px;
      overflow: hidden;
      border: 1px solid #e6eaf2;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
    }

    .scroll-area {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .scroll-container {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }

    .scroll-container::-webkit-scrollbar {
      display: none;
    }

    .scroll-content {
      width: 100%;
      padding: 30px 34px 24px;
    }

    .gradient {
      position: absolute;
      left: 0;
      right: 0;
      height: 100px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .gradient.visible {
      opacity: 1;
    }

    .gradient-top {
      top: 0;
      background: linear-gradient(
        to bottom,
        rgba(236, 234, 236, 0.95),
        rgba(244, 238, 246, 0)
      );
    }

    .gradient-bottom {
      bottom: 0;
      background: linear-gradient(
        to top,
        rgba(236, 234, 236, 0.95),
        rgba(242, 230, 247, 0)
      );
    }

    .title {
      font-size: 38px;
      font-weight: 700;
      color: var(--gray-900);
      letter-spacing: -0.9px;
      margin-bottom: 10px;
      line-height: 44px;
    }

    .byline {
      font-size: 16px;
      color: var(--gray-500);
    }

    .divider {
      height: 1px;
      background: var(--gray-200);
      margin: 16px 0;
      transform: scaleY(0.5);
      transform-origin: top;
    }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .meta-chip {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      background: var(--gray-100);
    }

    .meta-chip-label {
      font-size: 14px;
      font-weight: 500;
      color: var(--gray-500);
    }

    .meta-chip-value {
      font-size: 15px;
      font-weight: 700;
      color: var(--gray-900);
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag-pill {
      padding: 6px 10px;
      border-radius: 20px;
      border: 1px solid var(--gray-200);
    }

    .tag-pill-text {
      font-size: 13px;
      font-weight: 500;
      color: var(--gray-500);
    }

    .summary-heading {
      font-size: 19px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--gray-900);
    }

    .description {
      font-size: 16px;
      line-height: 25px;
      color: var(--gray-600);
      white-space: pre-wrap;
    }

    .section-block {
      margin-top: 20px;
    }

    .section-block h3 {
      font-size: 19px;
      font-weight: 700;
      color: var(--gray-900);
      margin: 16px 0 10px;
    }

    .section-block h3:first-child {
      margin-top: 0;
    }

    .section-block p {
      font-size: 16px;
      color: var(--gray-500);
      line-height: 25px;
      margin-bottom: 8px;
    }

    .section-block strong {
      font-weight: 600;
      color: #374151;
    }

    .section-block ul {
      list-style: none;
      padding: 0;
      margin: 0 0 12px;
    }

    .section-block li {
      position: relative;
      font-size: 16px;
      color: var(--gray-500);
      line-height: 25px;
      padding-inline-start: 18px;
      margin-bottom: 8px;
    }

    .section-block li::before {
      content: "•";
      position: absolute;
      inset-inline-start: 0;
      top: 0;
      color: var(--gray-500);
    }

    .footer {
      flex-shrink: 0;
      padding: 16px 24px 20px;
      border-top: 1px solid #eceff5;
      background: #fff;
    }

    .cta {
      display: block;
      width: 100%;
      border: none;
      border-radius: 999px;
      padding: 16px 15px;
      background: var(--purple);
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 500;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--purple-shadow);
      transition: transform 0.05s ease, box-shadow 0.05s ease;
    }

    .cta:active {
      box-shadow: none;
      transform: translateY(6px);
    }

    @media (max-width: 900px) {
      .page-container.is-visible {
        flex-direction: column;
        overflow-y: auto;
      }

      .cover-column {
        width: min(360px, 100%) !important;
        height: auto;
        max-height: 50vh;
        align-self: center;
      }

      .content-column {
        min-height: 420px;
      }
    }
  </style>
</head>

<body>
  <div class="root" id="root">
    <div class="back-btn-wrap">
      <button class="back-btn" id="backBtn" type="button" aria-label="חזרה">
        <i class="fa-solid fa-arrow-right" id="backIcon" aria-hidden="true"></i>
        <span class="back-btn-label" id="backLabel">חזרה</span>
      </button>
    </div>

    <div class="status is-visible" id="status">
      <p class="status-message" id="statusMessage">טוען את הספר…</p>
      <a class="status-link" id="statusLink" href="../index.html" hidden>חזרה לרשימת הספרים</a>
    </div>

    <div class="page-container" id="pageContainer">
      <div class="cover-column" id="coverColumn">
        <div class="cover-card">
          <img id="cover" alt="" src="https://placehold.co/300x320.png" />
        </div>
      </div>

      <div class="content-column">
        <div class="content-card">
          <div class="scroll-area" id="scrollArea">
            <div class="gradient gradient-top" id="gradTop"></div>
            <div class="gradient gradient-bottom" id="gradBottom"></div>
            <div class="scroll-container" id="scrollContainer">
              <div class="scroll-content" id="content"></div>
            </div>
          </div>

          <div class="footer">
            <button class="cta" id="cta" type="button">התאימו את הספר</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const LIVE_TEMPLATES_URL =
      "https://tiny-tale-backend-production.up.railway.app/v1/templates?language=he";
    const FALLBACK_TEMPLATES_URL = "/api/templates";
    const FALLBACK_COVER_URL = "https://placehold.co/300x320.png";
    const BACK_FALLBACK_URL = "../index.html";
    const COPY = {
      he: {
        backLabel: "חזרה",
        ctaLabel: "התאימו את הספר",
        bylinePrefix: "מאת",
        summaryHeading: "תקציר",
        pagesLabel: "עמודים",
        agesLabel: "גילאים",
        loading: "טוען את הספר…",
        missingId: "חסר מזהה תבנית.",
        notFound: "התבנית לא נמצאה.",
        fetchError: "לא ניתן לטעון את התבנית.",
        backLink: "חזרה לרשימת הספרים",
      },
      en: {
        backLabel: "Back",
        ctaLabel: "Personalize the book",
        bylinePrefix: "By",
        summaryHeading: "Summary",
        pagesLabel: "Pages",
        agesLabel: "Ages",
        loading: "Loading the book…",
        missingId: "Missing template id.",
        notFound: "Template not found.",
        fetchError: "Could not load the template.",
        backLink: "Back to book list",
      },
    };

    const statusEl = document.getElementById("status");
    const statusMessageEl = document.getElementById("statusMessage");
    const statusLinkEl = document.getElementById("statusLink");
    const pageContainerEl = document.getElementById("pageContainer");
    const coverEl = document.getElementById("cover");
    const ctaEl = document.getElementById("cta");
    const backBtnEl = document.getElementById("backBtn");
    const backIconEl = document.getElementById("backIcon");
    const backLabelEl = document.getElementById("backLabel");

    let ctaUrl = "https://tinytaleapp.com";
    let layoutBound = false;

    function stringsFor(language) {
      return language === "en" ? COPY.en : COPY.he;
    }

    function goBack() {
      if (window.history.length > 1 && document.referrer) {
        window.history.back();
      } else {
        window.location.href = BACK_FALLBACK_URL;
      }
    }

    function showStatus(message, showLink) {
      statusMessageEl.textContent = message;
      statusLinkEl.hidden = !showLink;
      statusEl.classList.add("is-visible");
      pageContainerEl.classList.remove("is-visible");
    }

    function showBook() {
      statusEl.classList.remove("is-visible");
      pageContainerEl.classList.add("is-visible");
    }

    function applyLocale(isHebrew) {
      const copy = stringsFor(isHebrew ? "he" : "en");
      document.documentElement.lang = isHebrew ? "he" : "en";
      document.documentElement.dir = isHebrew ? "rtl" : "ltr";
      backIconEl.classList.remove("fa-arrow-right", "fa-arrow-left");
      backIconEl.classList.add(isHebrew ? "fa-arrow-right" : "fa-arrow-left");
      backLabelEl.textContent = copy.backLabel;
      backBtnEl.setAttribute("aria-label", copy.backLabel);
      ctaEl.textContent = copy.ctaLabel;
      statusLinkEl.textContent = copy.backLink;
      return copy;
    }

    function renderMarkdown(md) {
      const lines = (md || "").replace(/\r\n/g, "\n").split("\n");
      let html = "";
      let inList = false;
      let para = [];

      const flushPara = () => {
        if (!para.length) return;
        const text = para.join(" ").trim();
        if (text) html += `<p>${inlineMd(text)}</p>`;
        para = [];
      };

      const closeList = () => {
        if (inList) {
          html += "</ul>";
          inList = false;
        }
      };

      for (const raw of lines) {
        const trimmed = raw.trimEnd().trim();
        if (!trimmed) {
          flushPara();
          closeList();
          continue;
        }
        const h3 = trimmed.match(/^###\s+(.+)$/);
        if (h3) {
          flushPara();
          closeList();
          html += `<h3>${inlineMd(h3[1])}</h3>`;
          continue;
        }
        const li = trimmed.match(/^\*\s+(.+)$/);
        if (li) {
          flushPara();
          if (!inList) {
            html += "<ul>";
            inList = true;
          }
          html += `<li>${inlineMd(li[1])}</li>`;
          continue;
        }
        closeList();
        para.push(trimmed);
      }
      flushPara();
      closeList();
      return html;
    }

    function inlineMd(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    }

    function escapeText(text) {
      return String(text || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    /** Formats target_age_range for display, e.g. [2, 9] → "2-9" */
    function formatTargetAgeRange(range) {
      if (!Array.isArray(range) || range.length === 0) return null;
      if (range.length === 1) return String(range[0]);
      return `${range[0]}-${range[range.length - 1]}`;
    }

    function metaChip(label, value) {
      return `<div class="meta-chip">
        <span class="meta-chip-label">${escapeText(label)}</span>
        <span class="meta-chip-value">${escapeText(value)}</span>
      </div>`;
    }

    function renderContent(template, copy) {
      const tags =
        template.tags && template.tags.length
          ? template.tags
          : template.categories || [];

      const tagsHtml = tags
        .map(
          (tag) =>
            `<div class="tag-pill"><span class="tag-pill-text">${escapeText(tag)}</span></div>`
        )
        .join("");

      const pageCount = Number(template.page_count) || 0;
      const pageCountBlock =
        pageCount > 0 ? metaChip(copy.pagesLabel, pageCount) : "";

      const ageRangeLabel = formatTargetAgeRange(template.target_age_range);
      const ageRangeBlock = ageRangeLabel
        ? metaChip(copy.agesLabel, ageRangeLabel)
        : "";

      const descriptionBlock = template.description
        ? `<div class="divider"></div>
           <h2 class="summary-heading">${escapeText(copy.summaryHeading)}</h2>
           <p class="description">${escapeText(template.description)}</p>`
        : "";

      document.getElementById("content").innerHTML = `
        <h1 class="title">${escapeText(template.title)}</h1>
        <p class="byline">${escapeText(copy.bylinePrefix)} ${escapeText(template.authorName)}</p>

        <div class="divider"></div>

        <div class="stats-row">
          ${pageCountBlock}
          ${ageRangeBlock}
          <div class="tag-row">${tagsHtml}</div>
        </div>

        ${descriptionBlock}

        <div class="section-block">
          ${renderMarkdown(template.authorNotes)}
        </div>
      `;
    }

    function setCover(url, title) {
      coverEl.alt = title || "Cover";
      coverEl.onerror = () => {
        coverEl.onerror = null;
        coverEl.src = FALLBACK_COVER_URL;
      };
      coverEl.src = url || FALLBACK_COVER_URL;
    }

    function updateLayout() {
      const w = window.innerWidth;
      const horizontalPadding = w >= 1400 ? 48 : 28;
      const coverColumnWidth = Math.min(450, Math.max(300, Math.round(w * 0.33)));

      document.documentElement.style.setProperty("--page-pad-x", horizontalPadding + "px");
      document.getElementById("coverColumn").style.width = coverColumnWidth + "px";
    }

    function updateGradients() {
      const el = document.getElementById("scrollContainer");
      const gradTop = document.getElementById("gradTop");
      const gradBottom = document.getElementById("gradBottom");
      const { scrollTop, scrollHeight, clientHeight } = el;
      const canScroll = scrollHeight > clientHeight + 2;
      gradTop.classList.toggle("visible", canScroll && scrollTop > 2);
      gradBottom.classList.toggle(
        "visible",
        canScroll && scrollTop < scrollHeight - clientHeight - 2
      );
    }

    function bindLayout() {
      if (layoutBound) return;
      layoutBound = true;
      document.getElementById("scrollContainer").addEventListener("scroll", updateGradients, {
        passive: true,
      });
      window.addEventListener("resize", () => {
        updateLayout();
        updateGradients();
      });
    }

    async function fetchTemplates() {
      try {
        const res = await fetch(LIVE_TEMPLATES_URL);
        if (!res.ok) throw new Error("live templates not ok");
        return await res.json();
      } catch {
        const res = await fetch(FALLBACK_TEMPLATES_URL);
        if (!res.ok) throw new Error("fallback templates not ok");
        return await res.json();
      }
    }

    function renderTemplate(template) {
      const isHebrew = template.language === "he";
      const copy = applyLocale(isHebrew);
      document.title = template.title || copy.ctaLabel;
      ctaUrl = `https://tinytaleapp.com/?preSelectedTemplateId=${encodeURIComponent(template.id)}`;
      setCover(template.cover_photo, template.title);
      renderContent(template, copy);
      showBook();
      bindLayout();
      updateLayout();
      requestAnimationFrame(updateGradients);
    }

    backBtnEl.addEventListener("click", goBack);

    ctaEl.addEventListener("click", () => {
      window.location.href = ctaUrl;
    });

    (async function init() {
      const id = new URLSearchParams(window.location.search).get("id");
      const copy = COPY.he;

      if (!id) {
        document.title = copy.missingId;
        showStatus(copy.missingId, true);
        return;
      }

      showStatus(copy.loading, false);

      try {
        const data = await fetchTemplates();
        const templates = Array.isArray(data && data.templates) ? data.templates : [];
        const template = templates.find((item) => item.id === id);
        if (!template) {
          document.title = copy.notFound;
          showStatus(copy.notFound, true);
          return;
        }
        renderTemplate(template);
      } catch {
        document.title = copy.fetchError;
        showStatus(copy.fetchError, true);
      }
    })();
  </script>
</body>

</html>
